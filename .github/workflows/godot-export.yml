name: Deploy Godot Web to Docs

on:
  push:
    branches:
      - develop # 対象のブランチ。mainの場合は変更してください
    paths:
      - "godot-project/**" # プロジェクトが更新された場合のみ実行

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # docs/をリポジトリにPushするために必要

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Github ActionがPushしたコミットで後続のWorkflowを起動させないための配慮
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Godot Engine
        uses: chickensoft-games/setup-godot@v2
        with:
          # ローカルで利用しているGodotバージョンに合わせて変更してください
          version: 4.3.0
          use-dotnet: false

      - name: Import Assets
        run: |
          cd godot-project
          # 最初にエディタモードで起動してすべてのアセットをインポートする（Godot4のセオリー）
          godot --headless --editor --quit || exit 0

      - name: Build Web Export
        run: |
          mkdir -p docs
          cd godot-project
          # 事前に作成したexport_presets.cfgの「Web」プリセットを使用してビルド
          godot --headless --export-release "Web" ../docs/index.html

      - name: Commit and Push to Docs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if ! git diff --staged --quiet; then
            git commit -m "build: auto export Godot to docs/ [skip ci]

            Co-Authored-By: gemini <218195315+gemini-cli@users.noreply.github.com>"
            git push origin HEAD
          else
            echo "No changes to commit."
          fi
