<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Play - Tall Life Simulator</title>
    <style>
      :root {
        --primary: #6366f1;
        --bg: #0f172a;
        --text: #f8fafc;
      }
      body {
        margin: 0;
        padding: 0;
        font-family: "Inter", sans-serif;
        background-color: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
      }
      
      header {
        width: 100%;
        padding: 1rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(15, 23, 42, 0.8);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        box-sizing: border-box;
        z-index: 10;
      }

      header h1 {
        margin: 0;
        font-size: 1.5rem;
        background: linear-gradient(to right, #818cf8, #c084fc);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .btn {
        padding: 0.5rem 1.5rem;
        border: none;
        border-radius: 9999px;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s;
        text-decoration: none;
      }

      .btn-back {
        background-color: transparent;
        color: #94a3b8;
        border: 1px solid #334155;
      }
      .btn-back:hover {
        background-color: #1e293b;
        color: white;
      }

      .btn-fullscreen {
        background: linear-gradient(to right, #6366f1, #c084fc);
        color: white;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .btn-fullscreen:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
      }

      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 2rem;
        box-sizing: border-box;
      }

      .game-container {
        width: 100%;
        max-width: 1280px;
        aspect-ratio: 16 / 9;
        background-color: #000;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
        position: relative;
        transition: transform 0.3s ease;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
      }

      /* Fullscreen mode styles */
      .game-container:fullscreen {
        max-width: none;
        border-radius: 0;
      }
      .game-container:-webkit-full-screen {
        max-width: none;
        border-radius: 0;
      }

      .controls {
        margin-top: 1.5rem;
        display: flex;
        gap: 1rem;
      }

      .hint {
        margin-top: 1rem;
        color: #64748b;
        font-size: 0.875rem;
      }

      /* Gradient background animation */
      .bg-gradient {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(
          circle at 50% -20%,
          rgba(99, 102, 241, 0.15) 0%,
          rgba(15, 23, 42, 0) 60%
        );
        z-index: -1;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="bg-gradient"></div>
    
    <header>
      <h1>Tall Life Simulator</h1>
      <a href="index.html" class="btn btn-back">← 戻る</a>
    </header>

    <main>
      <div class="game-container" id="game-container">
        <iframe src="game.html" id="game-iframe" tabindex="-1" allowfullscreen></iframe>
      </div>
      
      <div class="controls">
        <button id="fullscreen-btn" class="btn btn-fullscreen">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
          </svg>
          全画面でプレイ
        </button>
      </div>
      
      <p class="hint">ヒント: ゲーム画面内をクリックすると操作可能になります。全画面モードは ESC キーで解除できます。</p>
    </main>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const fullscreenBtn = document.getElementById("fullscreen-btn");
        const gameContainer = document.getElementById("game-container");
        const iframe = document.getElementById("game-iframe");

        // iframe click brings focus
        iframe.addEventListener("mouseenter", () => {
          iframe.focus();
        });

        fullscreenBtn.addEventListener("click", () => {
          if (gameContainer.requestFullscreen) {
            gameContainer.requestFullscreen();
          } else if (gameContainer.webkitRequestFullscreen) { /* Safari */
            gameContainer.webkitRequestFullscreen();
          } else if (gameContainer.msRequestFullscreen) { /* IE11 */
            gameContainer.msRequestFullscreen();
          }
        });
        
        // Listen to exit fullscreen
        document.addEventListener("fullscreenchange", () => {
          if (!document.fullscreenElement) {
            // Re-focus the iframe after exiting fullscreen just in case
            setTimeout(() => iframe.focus(), 100);
          }
        });
      });
    </script>
  </body>
</html>
