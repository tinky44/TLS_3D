<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tall Life Simulator - GitHub Pages</title>
    <style>
      :root {
        --primary: #6366f1;
        --bg: #0f172a;
        --text: #f8fafc;
      }
      body {
        margin: 0;
        padding: 0;
        font-family: "Inter", sans-serif;
        background-color: var(--bg);
        color: var(--text);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        overflow: hidden;
      }
      .container {
        padding: 2rem;
        z-index: 1;
      }
      h1 {
        font-size: 4rem;
        margin-bottom: 1rem;
        background: linear-gradient(to right, #818cf8, #c084fc);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;

        animation: fadeIn 2s ease-out;
      }
      p {
        font-size: 1.5rem;
        color: #94a3b8;
        margin-bottom: 2rem;
        animation: fadeIn 3s ease-out;
      }
      .status {
        display: inline-block;
        padding: 0.5rem 1rem;
        background: rgba(99, 102, 241, 0.1);
        border: 1px solid rgba(99, 102, 241, 0.2);
        border-radius: 9999px;
        font-size: 0.875rem;
        color: var(--primary);
        font-weight: 600;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      /* Gradient background animation */
      .bg-gradient {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(
          circle at 50% 50%,
          rgba(99, 102, 241, 0.1) 0%,
          rgba(15, 23, 42, 0) 50%
        );
        z-index: 0;
      }
    </style>
  </head>
  <body>
    <div class="bg-gradient"></div>
    <div class="container">
      <div class="status">Development Phase</div>
      <h1>Tall Life Simulator</h1>
      <p>新しい「背の高い人生」がここから始まります。</p>
    </div>
  </body>
</html>
