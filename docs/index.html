<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tall Life Simulator - GitHub Pages</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --primary: #3b82f6;
        --primary-light: #60a5fa;
        --accent: #06b6d4;
        --bg: #0f172a;
        --text: #f8fafc;
      }
      body {
        margin: 0;
        padding: 0;
        font-family: 'Outfit', 'Noto+Sans+JP', sans-serif;
        background-color: var(--bg);
        color: var(--text);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        overflow: hidden;
      }
      .container {
        padding: 2rem;
        z-index: 1;
      }
      h1 {
        font-size: 4.5rem;
        margin-bottom: 0.5rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        background: linear-gradient(135deg, #60a5fa 0%, #06b6d4 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: fadeIn 1.5s ease-out;
      }
      p {
        font-size: 1.25rem;
        color: #94a3b8;
        margin-bottom: 3rem;
        font-weight: 400;
        animation: fadeIn 2s ease-out;
      }
      .status {
        display: inline-block;
        padding: 0.5rem 1.25rem;
        background: rgba(59, 130, 246, 0.1);
        border: 1px solid rgba(59, 130, 246, 0.2);
        border-radius: 9999px;
        font-size: 0.875rem;
        color: var(--primary-light);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 1.5rem;
        animation: fadeIn 1s ease-out;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .btn-play {
        display: inline-block;
        padding: 1.25rem 3.5rem;
        background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        color: white;
        text-decoration: none;
        font-size: 1.25rem;
        font-weight: 700;
        border-radius: 12px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        animation: fadeIn 2.5s ease-out;
      }
      .btn-play:hover {
        transform: translateY(-4px) scale(1.02);
        box-shadow: 0 20px 25px -5px rgba(59, 130, 246, 0.5), 0 10px 10px -5px rgba(59, 130, 246, 0.2);
        background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
      }
      /* Animated background */
      .bg-ambient {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.15) 0%, transparent 40%),
                    radial-gradient(circle at 80% 70%, rgba(6, 182, 212, 0.15) 0%, transparent 40%);
        z-index: 0;
      }
      .bg-grid {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                          linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 40px 40px;
        z-index: -1;
      }
    </style>
  </head>
  <body>
    <div class="bg-ambient"></div>
    <div class="bg-grid"></div>
    <div class="container">
      <div class="status">Development Phase</div>
      <h1>Tall Life Simulator</h1>
      <p>新しい「背の高い人生」がここから始まります。</p>
      <a href="play.html" class="btn-play">ゲームをプレイする</a>
    </div>
  </body>
</html>
